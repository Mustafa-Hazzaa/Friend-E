{% extends "base.html" %}
{% block title %}AI Monitor{% endblock %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0b1220;
    color: #e5e7eb;
}

/* LOCK SCREEN */
.lock {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.lockBox {
    background: #111827;
    padding: 30px;
    border-radius: 14px;
    width: 320px;
    text-align: center;
}

.lockBox input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #0b1220;
    border: 1px solid #1f2937;
    color: white;
    border-radius: 8px;
}

.lockBox button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* APP LAYOUT */
.app {
    display: grid;
    grid-template-columns: 260px 1fr 360px;
    height: 100vh;
}

/* PANELS */
.panel {
    padding: 15px;
    overflow-y: auto;
}

.left {
    background: #0f172a;
    border-right: 1px solid #1f2937;
}

.center {
    background: #020617;
}

.right {
    background: #0f172a;
    border-left: 1px solid #1f2937;
}

/* SESSION */
.session {
    padding: 10px;
    margin-bottom: 10px;
    background: #111827;
    border-radius: 10px;
    cursor: pointer;
}

.session:hover {
    background: #1e293b;
}

/* CHAT */
.msg {
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    max-width: 75%;
}

.user {
    background: #1d4ed8;
    margin-left: auto;
}

.ai {
    background: #065f46;
}

/* CARDS */
.card {
    background: rgba(17,24,39,0.7);
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 12px;
}

/* CHARTS */
canvas {
    margin-top: 15px;
    background: #0b1220;
    border-radius: 12px;
    padding: 10px;
}

/* UTIL */
.hidden {
    display: none;
}
</style>

<!-- LOCK SCREEN -->
<div id="lockScreen" class="lock">
    <div class="lockBox">
        <h2>🔐 Secure Access</h2>

        <input id="password" type="password" placeholder="Enter password">
        <button onclick="unlock()">Unlock</button>

        <p id="error"></p>
    </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

    <!-- LEFT -->
    <div class="panel left">
        <h3>Sessions</h3>
        <div id="sessions"></div>
    </div>

    <!-- CENTER -->
    <div class="panel center">
        <h3>Conversation</h3>
        <div id="chat"></div>
    </div>

    <!-- RIGHT -->
    <div class="panel right">
        <h3>AI Analysis</h3>

        <div class="card" id="summary"></div>

        <canvas id="curiosityChart"></canvas>
        <canvas id="emotionChart"></canvas>
        <canvas id="interestChart"></canvas>

        <div class="card" id="concerns"></div>
        <div class="card" id="recommendations"></div>
    </div>

</div>

<script>

let curiosityChart, emotionChart, interestChart;

/* ===================== UNLOCK ===================== */
function unlock() {
    fetch("/check-monitor-password", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            password: document.getElementById("password").value
        })
    })
    .then(r => r.json())
    .then(d => {

        if (d.success || d.status === "ok") {
            document.getElementById("lockScreen").style.display = "none";
            document.getElementById("app").classList.remove("hidden");

            loadSessions();
            loadAnalysis();
        } else {
            document.getElementById("error").innerText = "Wrong password";
        }
    })
    .catch(() => {
        document.getElementById("error").innerText = "Server error";
    });
}

/* ===================== SESSIONS ===================== */
function loadSessions() {
    fetch("/get-sessions")
    .then(r => r.json())
    .then(data => {

        let box = document.getElementById("sessions");
        box.innerHTML = "";

        data.forEach(s => {
            let div = document.createElement("div");
            div.className = "session";

            div.innerHTML = `
                <b>${s.session_timestamp}</b><br>
                ${s.total_messages} messages
            `;

            div.onclick = () => openSession(s.file);

            box.appendChild(div);
        });
    });
}

/* ===================== CHAT ===================== */
function openSession(file) {
    fetch("/get-session/" + file)
    .then(r => r.json())
    .then(s => {

        let chat = document.getElementById("chat");
        chat.innerHTML = "";

        s.messages.forEach(m => {
            let div = document.createElement("div");
            div.className = "msg " + (m.role === "user" ? "user" : "ai");
            div.innerText = m.content;
            chat.appendChild(div);
        });
    });
}

/* ===================== ANALYSIS ===================== */
function loadAnalysis() {
    fetch("/analyze-child")
    .then(r => r.json())
    .then(d => {

        document.getElementById("summary").innerHTML =
            "<b>Summary</b><br>" + d.summary;

        renderCharts(d);

        document.getElementById("concerns").innerHTML =
            "<b>Concerns</b><br>" + (d.concerns || []).join("<br>");

        document.getElementById("recommendations").innerHTML =
            "<b>Recommendations</b><br>" + (d.recommendations || []).join("<br>");
    });
}

/* ===================== CHARTS ===================== */
function renderCharts(d) {

    let c = d.curiosity_level === "high" ? 80 :
            d.curiosity_level === "medium" ? 50 : 20;

    if (curiosityChart) curiosityChart.destroy();
    if (emotionChart) emotionChart.destroy();
    if (interestChart) interestChart.destroy();

    curiosityChart = new Chart(document.getElementById("curiosityChart"), {
        type: "doughnut",
        data: {
            labels: ["Curiosity", "Other"],
            datasets: [{ data: [c, 100 - c] }]
        }
    });

    emotionChart = new Chart(document.getElementById("emotionChart"), {
        type: "pie",
        data: {
            labels: ["Positive", "Neutral", "Confused"],
            datasets: [{ data: [60, 25, 15] }]
        }
    });

    let interests = d.interests || [];

    interestChart = new Chart(document.getElementById("interestChart"), {
        type: "bar",
        data: {
            labels: interests,
            datasets: [{
                label: "Interest Level",
                data: interests.map(() => Math.random() * 100)
            }]
        }
    });
}

</script>

{% endblock %}
